<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voucher Keeper - Quản Lý Voucher Thông Minh</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Thư viện Quét QR/Barcode & Crypto-JS (Chống trùng hash) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    /* Styling hiện đại với Glassmorphism & Tối ưu hiệu ứng chuyển cảnh */
    body {
      background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      color: #334155;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .btn-glow {
      box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Dynamic Active Barcode modal */
    .barcode-display {
      font-family: 'Libre Barcode 128', cursive, monospace;
      letter-spacing: 2px;
    }
  </style>
</head>
<body class="pb-24">

  <!-- TOP BAR -->
  <header class="sticky top-0 z-40 glass-card px-4 py-3 mb-4 flex justify-between items-center rounded-b-2xl">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-md">
        <i class="fa-solid fa-ticket"></i>
      </div>
      <span class="font-extrabold text-lg bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
        VoucherKeeper
      </span>
    </div>
    
    <!-- User Profile / Login -->
    <div id="authContainer">
      <button id="btnLogin" onclick="loginGoogle()" class="flex items-center space-x-2 bg-white border border-slate-200 px-3 py-1.5 rounded-full text-xs font-semibold shadow-sm hover:bg-slate-50 transition">
        <i class="fa-brands fa-google text-red-500"></i>
        <span>Đăng nhập</span>
      </button>
      <div id="userInfo" class="hidden flex items-center space-x-2">
        <img id="userAvatar" class="w-8 h-8 rounded-full border-2 border-indigo-500 shadow-sm" src="" alt="Avatar">
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-md mx-auto px-4">
    
    <!-- HERO DASHBOARD ACTION -->
    <div class="glass-card rounded-3xl p-5 mb-6 text-center relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl"></div>
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Màn hình thanh toán</h2>
      <p class="text-xs text-slate-400 mb-4">Mở nhanh tất cả voucher sẵn sàng dùng</p>
      
      <button onclick="startSession()" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold rounded-2xl btn-glow flex items-center justify-center space-x-2 active:scale-95 transition">
        <i class="fa-solid fa-bolt text-yellow-300"></i>
        <span>BẮT ĐẦU PHIÊN SỬ DỤNG</span>
      </button>
    </div>

    <!-- TABS NAVIGATION -->
    <div class="flex space-x-2 mb-4 bg-slate-200/60 p-1 rounded-2xl text-xs font-bold text-slate-500">
      <button onclick="switchTab('active')" id="tabActive" class="flex-1 py-2 rounded-xl bg-white text-indigo-600 shadow-sm transition">
        Khả dụng (<span id="countActive">0</span>)
      </button>
      <button onclick="switchTab('used')" id="tabUsed" class="flex-1 py-2 rounded-xl hover:text-slate-700 transition">
        Đã dùng
      </button>
      <button onclick="switchTab('expired')" id="tabExpired" class="flex-1 py-2 rounded-xl hover:text-slate-700 transition">
        Hết hạn
      </button>
    </div>

    <!-- VOUCHER LIST CONTAINER -->
    <div id="voucherContainer" class="space-y-4">
      <!-- Loading Skeleton -->
      <div class="glass-card rounded-2xl p-4 animate-pulse flex space-x-4">
        <div class="w-20 h-20 bg-slate-200 rounded-xl"></div>
        <div class="flex-1 space-y-2 py-1">
          <div class="h-4 bg-slate-200 rounded w-3/4"></div>
          <div class="h-3 bg-slate-200 rounded w-1/2"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- FLOATING UPLOAD BUTTON -->
  <button onclick="openUploadModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-lg hover:bg-indigo-700 active:scale-90 transition z-30">
    <i class="fa-solid fa-plus text-xl"></i>
  </button>

  <!-- ----------------- MODAL: UPLOAD VOUCHER ----------------- -->
  <div id="modalUpload" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800">Thêm Voucher Mới</h3>
        <button onclick="closeUploadModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <!-- File Upload Dropzone -->
      <div class="border-2 border-dashed border-indigo-200 bg-indigo-50/50 rounded-2xl p-6 text-center cursor-pointer relative" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
        <i class="fa-solid fa-cloud-arrow-up text-3xl text-indigo-500 mb-2"></i>
        <p class="text-xs font-semibold text-slate-600">Bấm để chọn ảnh hoặc chụp voucher</p>
        <p class="text-[10px] text-slate-400 mt-1">Hệ thống sẽ tự quét QR/Barcode trên ảnh</p>
      </div>

      <!-- Preview & Detected Info -->
      <div id="uploadPreviewContainer" class="hidden space-y-3">
        <img id="imgPreview" class="w-full h-36 object-cover rounded-xl border" src="" alt="Preview">
        
        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-slate-500 mb-1 font-semibold">Mã Voucher (Tự nhận diện):</label>
            <input type="text" id="inputCode" placeholder="Nhập thủ công nếu ảnh mờ..." class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-500 mb-1 font-semibold">Ngày hết hạn:</label>
            <input type="date" id="inputExpDate" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button id="btnSaveVoucher" onclick="saveVoucher()" disabled class="w-full py-3 bg-indigo-600 disabled:bg-slate-300 text-white font-bold rounded-xl shadow transition">
        Lưu Voucher
      </button>
    </div>
  </div>

  <!-- ----------------- MODAL: PHIÊN SỬ DỤNG (SESSION FULLSCREEN) ----------------- -->
  <div id="modalSession" class="fixed inset-0 bg-slate-950 z-50 hidden flex flex-col justify-between p-4 text-white">
    <!-- Header Session -->
    <div class="flex justify-between items-center pt-2 px-2">
      <span class="text-xs font-bold bg-white/10 px-3 py-1 rounded-full border border-white/20">
        Phiên dùng: <span id="sessionIndex">1</span>/<span id="sessionTotal">0</span>
      </span>
      <button onclick="endSession()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-300 hover:text-white">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Active Card Display -->
    <div id="sessionCard" class="my-auto space-y-4">
      <div class="bg-white text-slate-800 rounded-3xl p-4 shadow-2xl space-y-3 max-w-sm mx-auto">
        <img id="sessionImg" class="w-full h-48 object-cover rounded-2xl" src="" alt="Voucher">
        
        <!-- Big Display Barcode / QR Code Area -->
        <div class="bg-slate-50 p-4 rounded-xl text-center border border-slate-100">
          <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Mã Quét Thu Ngân</p>
          <div id="sessionCodeDisplay" class="font-mono text-2xl font-black text-indigo-600 tracking-wider break-all">
            <!-- Dynamic Code -->
          </div>
        </div>

        <div class="flex justify-between items-center text-xs text-slate-500 px-1">
          <span>Hạn dùng:</span>
          <span id="sessionExpDate" class="font-bold text-red-500">--/--/----</span>
        </div>
      </div>
    </div>

    <!-- Session Action Buttons (2 Option UX) -->
    <div class="max-w-sm mx-auto w-full grid grid-cols-2 gap-4 pb-4">
      <button onclick="sessionSkip()" class="py-4 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl font-bold text-slate-200 active:scale-95 transition flex items-center justify-center space-x-2">
        <i class="fa-solid fa-forward text-slate-400"></i>
        <span>Bỏ Qua</span>
      </button>

      <button onclick="sessionRedeem()" class="py-4 bg-emerald-500 hover:bg-emerald-600 rounded-2xl font-bold text-white shadow-lg shadow-emerald-500/30 active:scale-95 transition flex items-center justify-center space-x-2">
        <i class="fa-solid fa-check text-white"></i>
        <span>SỬ DỤNG</span>
      </button>
    </div>
  </div>

  <!-- Dummy Hidden Reader for html5-qrcode -->
  <div id="reader" class="hidden"></div>

  <!-- FIREBASE V10 SCRIPT & APP LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, doc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // 1. CẤU HÌNH FIREBASE (Dán config Firebase của bạn vào đây)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Whitelist Email được phép dùng hệ thống
    const ALLOWED_EMAILS = ["youremail@gmail.com"];

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const provider = new GoogleAuthProvider();

    // App State Variables
    let currentUser = null;
    let currentTab = 'active';
    let loadedVouchers = [];
    let sessionList = [];
    let sessionCurrentIndex = 0;
    let selectedFile = null;
    let selectedFileHash = '';

    // --- AUTHENTICATION ---
    window.loginGoogle = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        if (!ALLOWED_EMAILS.includes(result.user.email)) {
          alert("Email của bạn không có quyền truy cập hệ thống!");
          await auth.signOut();
        }
      } catch (err) {
        alert("Lỗi đăng nhập: " + err.message);
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user && ALLOWED_EMAILS.includes(user.email)) {
        currentUser = user;
        document.getElementById('btnLogin').classList.add('hidden');
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('userAvatar').src = user.photoURL;
        loadVouchers('active');
      } else {
        currentUser = null;
        document.getElementById('btnLogin').classList.remove('hidden');
        document.getElementById('userInfo').classList.add('hidden');
        document.getElementById('voucherContainer').innerHTML = `<p class="text-center text-xs text-slate-400 py-8">Vui lòng đăng nhập để xem dữ liệu.</p>`;
      }
    });

    // --- TAB & DATA LOADING (OPTIMIZED) ---
    window.switchTab = (tab) => {
      currentTab = tab;
      ['Active', 'Used', 'Expired'].forEach(t => {
        const btn = document.getElementById(`tab${t}`);
        if (t.toLowerCase() === tab) {
          btn.className = "flex-1 py-2 rounded-xl bg-white text-indigo-600 shadow-sm transition";
        } else {
          btn.className = "flex-1 py-2 rounded-xl hover:text-slate-700 transition";
        }
      });
      loadVouchers(tab);
    };

    async function loadVouchers(type) {
      if (!currentUser) return;
      const container = document.getElementById('voucherContainer');
      container.innerHTML = `<div class="text-center text-xs text-slate-400 py-6"><i class="fa-solid fa-spinner fa-spin text-lg"></i> Đang tải...</div>`;

      const today = new Date().toISOString().split('T')[0];
      let q;

      try {
        if (type === 'active') {
          // Tối ưu: Chỉ load voucher chưa dùng VÀ còn hạn
          q = query(collection(db, "vouchers"), where("is_used", "==", false), where("expiration_date", ">=", today));
        } else if (type === 'used') {
          // Lazy Load: Chỉ tải voucher đã dùng khi bấm tab
          q = query(collection(db, "vouchers"), where("is_used", "==", true));
        } else if (type === 'expired') {
          // Lazy Load: Voucher quá hạn
          q = query(collection(db, "vouchers"), where("is_used", "==", false), where("expiration_date", "<", today));
        }

        const snapshot = await getDocs(q);
        loadedVouchers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        if (type === 'active') {
          document.getElementById('countActive').innerText = loadedVouchers.length;
        }

        renderVoucherList(loadedVouchers);
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p class="text-center text-xs text-red-400 py-4">Lỗi tải dữ liệu. Cần tạo Index Firestore nếu đây là lần đầu.</p>`;
      }
    }

    function renderVoucherList(list) {
      const container = document.getElementById('voucherContainer');
      if (list.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">Không tìm thấy voucher nào.</p>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="glass-card rounded-2xl p-3 flex space-x-3 items-center">
          <img src="${item.image_url}" class="w-16 h-16 object-cover rounded-xl border" alt="Voucher">
          <div class="flex-1 min-w-0">
            <p class="font-bold text-slate-800 text-sm truncate">${item.code || 'Mã hình ảnh'}</p>
            <p class="text-[11px] text-slate-400 mt-0.5">Hạn: <span class="font-semibold text-slate-600">${item.expiration_date || 'Không có'}</span></p>
          </div>
          ${!item.is_used ? `
            <button onclick="quickRedeem('${item.id}')" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 font-bold text-xs rounded-xl hover:bg-indigo-600 hover:text-white transition">
              Đánh dấu dùng
            </button>
          ` : `<span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-lg">Đã dùng</span>`}
        </div>
      `).join('');
    }

    window.quickRedeem = async (id) => {
      if (confirm("Xác nhận đã sử dụng voucher này?")) {
        await updateDoc(doc(db, "vouchers", id), { is_used: true });
        loadVouchers(currentTab);
      }
    };

    // --- UPLOAD & DUPLICATE CHECK (SCAN QR/BARCODE + HASH) ---
    window.openUploadModal = () => document.getElementById('modalUpload').classList.remove('hidden');
    window.closeUploadModal = () => {
      document.getElementById('modalUpload').classList.add('hidden');
      document.getElementById('uploadPreviewContainer').classList.add('hidden');
      document.getElementById('btnSaveVoucher').disabled = true;
    };

    window.handleFileSelect = async (event) => {
      selectedFile = event.target.files[0];
      if (!selectedFile) return;

      // 1. Hiển thị Preview
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('imgPreview').src = e.target.result;
        document.getElementById('uploadPreviewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(selectedFile);

      // 2. Tính SHA-256 Hash ảnh chống trùng tuyệt đối
      const arrayBuffer = await selectedFile.arrayBuffer();
      const wordArray = CryptoJS.lib.WordArray.create(arrayBuffer);
      selectedFileHash = CryptoJS.SHA256(wordArray).toString();

      // 3. Quét QR / Barcode tự động bằng html5-qrcode
      const html5QrCode = new Html5Qrcode("reader");
      try {
        const decodedText = await html5QrCode.scanFile(selectedFile, true);
        document.getElementById('inputCode').value = decodedText;
      } catch (err) {
        document.getElementById('inputCode').value = ''; // Nếu mờ không tìm thấy thì trống
      }

      document.getElementById('btnSaveVoucher').disabled = false;
    };

    window.saveVoucher = async () => {
      const code = document.getElementById('inputCode').value.trim();
      const expDate = document.getElementById('inputExpDate').value;

      if (!code) {
        alert("Vui lòng nhập hoặc kiểm tra lại Mã Voucher!");
        return;
      }

      document.getElementById('btnSaveVoucher').innerText = "Đang kiểm tra trùng lặp...";
      document.getElementById('btnSaveVoucher').disabled = true;

      try {
        // Kiểm tra trùng lặp theo Hash hoặc Mã Code trong Firestore
        const qCode = query(collection(db, "vouchers"), where("code", "==", code));
        const qHash = query(collection(db, "vouchers"), where("image_hash", "==", selectedFileHash));
        
        const [snapCode, snapHash] = await Promise.all([getDocs(qCode), getDocs(qHash)]);

        if (!snapCode.empty || !snapHash.empty) {
          alert("CẢNH BÁO: Voucher này (hoặc ảnh này) đã tồn tại trên hệ thống!");
          document.getElementById('btnSaveVoucher').innerText = "Lưu Voucher";
          document.getElementById('btnSaveVoucher').disabled = false;
          return;
        }

        // Tải ảnh lên Firebase Storage
        const storageRef = ref(storage, `vouchers/${Date.now()}_${selectedFile.name}`);
        await uploadBytes(storageRef, selectedFile);
        const downloadURL = await getDownloadURL(storageRef);

        // Lưu bản ghi vào Firestore
        await addDoc(collection(db, "vouchers"), {
          code: code,
          expiration_date: expDate || '2099-12-31',
          image_url: downloadURL,
          image_hash: selectedFileHash,
          is_used: false,
          created_at: new Date().toISOString(),
          created_by: currentUser.email
        });

        alert("Thêm voucher thành công!");
        closeUploadModal();
        loadVouchers('active');
      } catch (err) {
        alert("Lỗi khi lưu: " + err.message);
      }
    };

    // --- PHIÊN SỬ DỤNG LOGIC (USE SESSION) ---
    window.startSession = async () => {
      const today = new Date().toISOString().split('T')[0];
      const q = query(collection(db, "vouchers"), where("is_used", "==", false), where("expiration_date", ">=", today));
      const snapshot = await getDocs(q);
      
      sessionList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      if (sessionList.length === 0) {
        alert("Không có voucher nào khả dụng để tạo phiên sử dụng!");
        return;
      }

      sessionCurrentIndex = 0;
      document.getElementById('sessionTotal').innerText = sessionList.length;
      renderSessionItem();
      document.getElementById('modalSession').classList.remove('hidden');
    };

    function renderSessionItem() {
      if (sessionCurrentIndex >= sessionList.length) {
        alert("Đã duyệt hết tất cả voucher trong phiên!");
        endSession();
        return;
      }

      const item = sessionList[sessionCurrentIndex];
      document.getElementById('sessionIndex').innerText = sessionCurrentIndex + 1;
      document.getElementById('sessionImg').src = item.image_url;
      document.getElementById('sessionCodeDisplay').innerText = item.code || 'KHÔNG CÓ MÃ';
      document.getElementById('sessionExpDate').innerText = item.expiration_date;
    }

    // Option 1: Bỏ qua (Voucher giữ nguyên)
    window.sessionSkip = () => {
      sessionCurrentIndex++;
      renderSessionItem();
    };

    // Option 2: Sử dụng (Đánh dấu is_used = true)
    window.sessionRedeem = async () => {
      const item = sessionList[sessionCurrentIndex];
      await updateDoc(doc(db, "vouchers", item.id), { is_used: true });
      
      sessionCurrentIndex++;
      renderSessionItem();
    };

    window.endSession = () => {
      document.getElementById('modalSession').classList.add('hidden');
      loadVouchers(currentTab);
    };
  </script>
</body>
</html>
